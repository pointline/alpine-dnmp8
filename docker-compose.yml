### Networks ###
networks:
  net-all:
    driver: bridge

### Volumes ###
volumes:
  data-mysql80:
    driver: local
  data-redis:
    driver: local
  data-rabbitmq:
    driver: local
  data-elasticsearch7:
    driver: local
